<html>
  <head>
    <title>My Reading List</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?" />
    <link
      rel="preload"
      as="image"
      href="static/loading%20screen.png"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="static/background.webp"
      media="(min-width: 769px)"
    />
    <link
      rel="preload"
      as="image"
      href="static/background_mobile.jpeg"
      media="(max-width: 768px)"
    />
    <link rel="stylesheet" type="text/css" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://unpkg.com/terminal.css@0.7.4/dist/terminal.min.css"
    />

    <script src="js/main.js"></script>
    <script src="js/music.js"></script>
  </head>
  <body>
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <div class="message">
        <span>B</span><span>o</span><span>o</span><span>t</span><span>l</span
        ><span>i</span><span>c</span><span>k</span><span>i</span><span>n</span
        ><span>g</span>
      </div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
    <button
      id="bg-toggle"
      class="bg-toggle"
      type="button"
      aria-label="Toggle background"
    >
      toggle
    </button>
    <div class="container window pre-show">
      <div class="window-controls" aria-hidden="true">
        <span class="dot dot-close"></span>
        <span class="dot dot-min"></span>
        <span class="dot dot-max"></span>
      </div>
      <div class="logo terminal-prompt heading">
        <span>My Reading List</span>
      </div>
      <div class="description">
        <p>a labour of love, not a reading list.</p>
      </div>
      <nav class="terminal-menu">
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-label="Toggle menu"
        >
          menu ⋯
        </button>
        <ul>
          <li><a href="#links">#links</a></li>
          <li><a href="#present">#books</a></li>
          <li><a href="#art">#art</a></li>
          <li><a href="#audio">#audio</a></li>
        </ul>
      </nav>
      <div class="progress-bar" id="scroll-progress">
        <div class="progress-bar-filled" style="width: 0%"></div>
      </div>
      <div id="book-list" class="list"></div>
    </div>

    <div class="music-player window pre-show">
      <div class="music-player-header">
        <h3>Music Recommendations</h3>
        <h4>
          <span class="prefix">playing from</span
          ><span class="link-clip"><a id="music-playlist"></a></span>
        </h4>
      </div>

      <div class="music-player-body">
        <div id="music-image"></div>
        <div id="music-info">
          <h3 id="music-title"></h3>
          <p id="music-artist"></p>
        </div>
        <div id="music-progress">
          <div id="music-progress-filled"></div>
        </div>
        <div id="music-controls">
          <button id="prev-btn" aria-label="Previous"></button>
          <button id="play-btn" aria-label="Play"></button>
          <button id="next-btn" aria-label="Next"></button>
        </div>
      </div>
    </div>

    <div class="window-gui window">
      <div class="window-controls-gui" aria-hidden="true">
        <span class="dot dot-close"></span>
        <span class="title">Untitled</span>
      </div>
      <div class="content"></div>
    </div>

    <script>
      window.addEventListener("load", async () => {
        const VISIBLE_COUNT = 10;
        const MAX_WAIT_MS = 3000;

        await new Promise((r) => setTimeout(r, 150));

        const waitForImages = Promise.all(
          [...document.images].slice(0, VISIBLE_COUNT).map((img) =>
            img.complete
              ? null
              : new Promise((res) => {
                  img.addEventListener("load", res, { once: true });
                  img.addEventListener("error", res, { once: true });
                }),
          ),
        );
        const timeout = new Promise((r) => setTimeout(r, MAX_WAIT_MS));
        await Promise.race([waitForImages, timeout]);

        document.getElementById("loading-screen")?.classList.add("hidden");
        document
          .querySelectorAll(".window.pre-show")
          .forEach((el) => el.classList.remove("pre-show"));
        window.dispatchEvent(new Event("windows-shown"));
      });
    </script>
  </body>
</html>
